syntax = "proto3";

package unified.v1;

option go_package = "github.com/unified-finance/unified/packages/generated/go/unified/v1;unifiedv1";

// Identifier is a canonical, non-empty, case-sensitive identifier.
message Identifier {
  string value = 1;
}

// AssetId identifies a registry-controlled asset and denomination.
message AssetId {
  string value = 1;
}

// PartyId identifies a person, organization, wallet principal, or protocol role.
message PartyId {
  string value = 1;
}

// LoanId identifies one canonical loan aggregate.
message LoanId {
  string value = 1;
}

// AssetKind describes the settlement and custody behavior of an asset.
enum AssetKind {
  ASSET_KIND_UNSPECIFIED = 0;
  ASSET_KIND_NATIVE = 1;
  ASSET_KIND_FUNGIBLE_TOKEN = 2;
  ASSET_KIND_NON_FUNGIBLE_TOKEN = 3;
  ASSET_KIND_FIAT = 4;
  ASSET_KIND_OFF_CHAIN = 5;
}

// AssetDescriptor contains immutable identity and precision metadata.
message AssetDescriptor {
  AssetId asset_id = 1;
  AssetKind kind = 2;
  string chain_domain = 3;
  string contract_address = 4;
  string symbol = 5;
  uint32 decimals = 6;
  string registry_version = 7;
}

// Money is an exact signed integer quantity in the asset's smallest unit.
// Units MUST be a canonical base-10 integer string with no exponent or decimal.
message Money {
  AssetId asset_id = 1;
  string units = 2;
}

// PolicyReference binds behavior to an immutable policy version and hash.
message PolicyReference {
  string policy_id = 1;
  string version = 2;
  bytes content_hash = 3;
}

