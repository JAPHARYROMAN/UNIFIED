  string route_escrow_units = 3;
  string chain_escrow_units = 4;
  string adapter_escrow_units = 5;
  string aggregate_escrow_units = 6;
  string circulating_supply_reference_units = 7;
  bytes circulating_supply_evidence_hash = 8;
  string route_absolute_cap_units = 9;
  string chain_absolute_cap_units = 10;
  string adapter_absolute_cap_units = 11;
  string aggregate_absolute_cap_units = 12;
  uint32 route_percentage_basis_points = 13;
  uint32 aggregate_percentage_basis_points = 14;
  bytes block_hash = 15;
  uint64 block_number = 16;
}

message WrappedUftBackingSnapshot {
  Identifier route_id = 1;
  AssetId canonical_uft_asset_id = 2;
  AssetId wrapped_uft_asset_id = 3;
  string canonical_escrow_units = 4;
