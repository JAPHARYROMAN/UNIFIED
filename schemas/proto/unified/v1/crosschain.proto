}

message CrossChainReconciliationDifference {
  Identifier difference_id = 1;
  Identifier run_id = 2;
  string dimension = 3;
  string reason_code = 4;
  AssetId asset_id = 5;
  string expected_units = 6;
  string observed_units = 7;
  bytes message_id = 8;
  LoanId loan_id = 9;
  string severity = 10;
  string owner = 11;
  google.protobuf.Timestamp detected_at = 12;
  google.protobuf.Timestamp resolution_deadline = 13;
  bytes evidence_hash = 14;
  string status = 15;
}

message CrossChainReconciliationRun {
  Identifier run_id = 1;
  string home_chain_id = 2;
  string satellite_chain_id = 3;
  uint64 route_version = 4;
  bytes home_head_hash = 5;
