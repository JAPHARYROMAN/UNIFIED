message CrossChainGovernanceAction {
  Identifier governance_action_id = 1;
  CrossChainGovernanceActionType action_type = 2;
  Identifier route_id = 3;
  uint64 current_route_version = 4;
  uint64 proposed_route_version = 5;
  bytes exact_payload_hash = 6;
  bytes authority_set_hash = 7;
  google.protobuf.Timestamp executable_after = 8;
  google.protobuf.Timestamp expires_at = 9;
  bytes superseded_policy_hash = 10;
}

message CrossChainReorganizationEvidence {
  string chain_id = 1;
  bytes orphaned_block_hash = 2;
  bytes replacement_block_hash = 3;
  bytes detected_head_hash = 4;
  uint64 block_number = 5;
  uint64 detected_head_number = 6;
  repeated bytes affected_message_ids = 7;
  bytes evidence_hash = 8;
  google.protobuf.Timestamp detected_at = 9;
  CrossChainSourceEventProof orphaned_source_proof = 10;
  bytes orphaned_event_evidence_hash = 11;
  uint64 replacement_block_number = 12;
  bytes replacement_header_authority_hash = 13;
  bytes replacement_observer_signed_header_commitment = 14;
  bytes replacement_observer_signature = 15;
  bytes detected_head_header_authority_hash = 16;
  bytes detected_head_observer_signed_header_commitment = 17;
  bytes detected_head_observer_signature = 18;
  bytes finality_policy_hash = 19;
  CrossChainFinalityCertificate orphaned_finality_certificate = 20;
  // The following three arrays are sorted and index-aligned with
  // affected_message_ids. Fields 10, 11, and 20 remain the first-item anchor
  // for wire compatibility and must equal array element zero.
  repeated CrossChainSourceEventProof affected_orphaned_source_proofs = 21;
  repeated bytes affected_orphaned_event_evidence_hashes = 22;
  repeated CrossChainFinalityCertificate affected_orphaned_finality_certificates = 23;
}

message CrossChainIncident {
  Identifier incident_id = 1;
  Identifier route_id = 2;
  repeated bytes affected_message_ids = 3;
  string reason_code = 4;
  string owner = 5;
  bytes evidence_hash = 6;
  google.protobuf.Timestamp opened_at = 7;
  string status = 8;
}
