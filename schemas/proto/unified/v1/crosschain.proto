  bytes satellite_block_hash = 9;
  bytes evidence_hash = 10;
}

message CrossChainLedgerPostingIntent {
  Identifier posting_intent_id = 1;
  bytes message_id = 2;
  string source_chain_id = 3;
  string destination_chain_id = 4;
  Identifier route_id = 5;
  uint64 route_version = 6;
  LoanId loan_id = 7;
  string entry_type = 8;
  AssetId asset_id = 9;
  string units = 10;
  repeated string debit_account_codes = 11;
  repeated string credit_account_codes = 12;
  bytes source_evidence_hash = 13;
  string idempotency_key = 14;
  Identifier correlation_id = 15;
