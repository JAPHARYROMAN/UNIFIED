syntax = "proto3";

package unified.v1;

import "google/protobuf/timestamp.proto";
import "unified/v1/risk.proto";
import "unified/v1/types.proto";

option go_package = "github.com/unified-finance/unified/packages/generated/go/unified/v1;unifiedv1";

enum CollateralKind {
  COLLATERAL_KIND_UNSPECIFIED = 0;
  COLLATERAL_KIND_NATIVE = 1;
  COLLATERAL_KIND_ERC20 = 2;
  COLLATERAL_KIND_ERC721 = 3;
  COLLATERAL_KIND_ERC1155 = 4;
}

enum CollateralStatus {
  COLLATERAL_STATUS_UNSPECIFIED = 0;
  COLLATERAL_STATUS_LOCKED = 1;
  COLLATERAL_STATUS_RELEASED = 2;
  COLLATERAL_STATUS_LIQUIDATED = 3;
  COLLATERAL_STATUS_CLAIMED = 4;
}

message CollateralItem {
  Identifier collateral_id = 1;
  LoanId loan_id = 2;
  AssetId asset_id = 3;
  CollateralKind kind = 4;
  string token_address = 5;
  string token_id = 6;
  string quantity = 7;
  PartyId owner_id = 8;
  google.protobuf.Timestamp locked_at = 9;
  CollateralStatus status = 10;
  bytes custody_evidence_hash = 11;
}

message CollateralBundle {
  LoanId loan_id = 1;
  repeated CollateralItem items = 2;
  uint64 state_version = 3;
}

message UftCollateralExposure {
  LoanId loan_id = 1;
  PartyId borrower_id = 2;
  string loan_quantity = 3;
  string borrower_quantity = 4;
  string circulating_supply = 5;
  Money backed_debt_value = 6;
  Money protocol_debt_ceiling = 7;
  bytes policy_evidence_hash = 8;
}

enum LiquidationRoute {
  LIQUIDATION_ROUTE_UNSPECIFIED = 0;
  LIQUIDATION_ROUTE_DIRECT = 1;
  LIQUIDATION_ROUTE_DUTCH_AUCTION = 2;
  LIQUIDATION_ROUTE_ENGLISH_AUCTION = 3;
}

enum LiquidationStatus {
  LIQUIDATION_STATUS_UNSPECIFIED = 0;
  LIQUIDATION_STATUS_ACTIVE = 1;
  LIQUIDATION_STATUS_SETTLED = 2;
  LIQUIDATION_STATUS_FAILED = 3;
  LIQUIDATION_STATUS_CANCELLED = 4;
}

message LiquidationPlan {
  Identifier liquidation_id = 1;
  LoanId loan_id = 2;
  Identifier collateral_id = 3;
  LiquidationRoute route = 4;
  string quantity = 5;
  Money reference_proceeds = 6;
  Money reserve_price = 7;
  Money execution_cost_cap = 8;
  uint32 incentive_basis_points = 9;
  uint32 minimum_bid_increment_basis_points = 10;
  google.protobuf.Timestamp starts_at = 11;
  google.protobuf.Timestamp ends_at = 12;
  bytes policy_set_hash = 13;
  bytes trigger_snapshot_hash = 14;
  OracleObservation pricing_observation = 15;
  LiquidationStatus status = 16;
}

message LiquidationBid {
  Identifier liquidation_id = 1;
  PartyId bidder_id = 2;
  Money amount = 3;
  google.protobuf.Timestamp placed_at = 4;
  bytes transaction_evidence_hash = 5;
}

message LiquidationSettlement {
  Identifier liquidation_id = 1;
  LoanId loan_id = 2;
  Money gross_proceeds = 3;
  Money execution_costs = 4;
  Money liquidation_incentive = 5;
  Money secured_claim_paid = 6;
  Money borrower_surplus = 7;
  Money residual_bad_debt = 8;
  PartyId buyer_id = 9;
  PartyId executor_id = 10;
  Identifier payment_id = 11;
  bytes journal_reference = 12;
  bytes pricing_evidence_hash = 13;
  google.protobuf.Timestamp settled_at = 14;
}
