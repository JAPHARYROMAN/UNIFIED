syntax = "proto3";

package unified.v1;

import "google/protobuf/timestamp.proto";
import "unified/v1/types.proto";

option go_package = "github.com/unified-finance/unified/packages/generated/go/unified/v1;unifiedv1";

// PostingSide is the double-entry side of one ledger line.
enum PostingSide {
  POSTING_SIDE_UNSPECIFIED = 0;
  POSTING_SIDE_DEBIT = 1;
  POSTING_SIDE_CREDIT = 2;
}

// LedgerEntryIntent is one exact-denomination line in a proposed journal.
message LedgerEntryIntent {
  string account_code = 1;
  PostingSide side = 2;
  Money amount = 3;
  PartyId party_id = 4;
}

// LedgerPostingIntent proposes an idempotent, balanced journal.
message LedgerPostingIntent {
  Identifier posting_id = 1;
  string legal_entity_id = 2;
  string book_id = 3;
  string source_system = 4;
  string idempotency_key = 5;
  google.protobuf.Timestamp effective_at = 6;
  repeated LedgerEntryIntent entries = 7;
  Identifier correlation_id = 8;
  bytes evidence_hash = 9;
}

// PaymentEvidence records provider or chain evidence without equating
// submission with final settlement.
message PaymentEvidence {
  Identifier payment_id = 1;
  string provider_id = 2;
  string provider_reference = 3;
  string finality_status = 4;
  Money amount = 5;
  google.protobuf.Timestamp observed_at = 6;
  bytes evidence_hash = 7;
}

// CrossChainMessage binds a unique action to source and destination domains.
message CrossChainMessage {
  Identifier message_id = 1;
  string source_domain = 2;
  string destination_domain = 3;
  uint64 source_nonce = 4;
  string action_type = 5;
  bytes action_payload = 6;
  bytes source_evidence_hash = 7;
  google.protobuf.Timestamp expires_at = 8;
}

