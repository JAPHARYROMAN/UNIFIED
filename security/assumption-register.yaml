version: 1
reviewed_at: 2026-07-24
assumptions:
  - id: ASM-001
    assumption: Foundation execution is local-only and carries no real value.
    owner: Release Authority
    evidence: infrastructure/local/compose.yaml
    expiry: 2026-10-24
    downstream_impact: All local safety controls and smoke tests
    validation: Reject production environment names and require local labels
  - id: ASM-002
    assumption: EVM chain id 31337 is development-only and is not a production-chain choice.
    owner: Protocol Architecture Authority
    evidence: adr/0004-local-development-topology.md
    expiry: 2026-10-24
    downstream_impact: Contract configuration and chain-domain identifiers
    validation: Production chain requires a new accepted ADR
  - id: ASM-003
    assumption: Provider callbacks are synthetic and contain no personal or financial data.
    owner: Security Authority
    evidence: infrastructure/local/mock-provider/
    expiry: 2026-10-24
    downstream_impact: Payment identity oracle and bridge adapters
    validation: Test fixtures use reserved example identifiers only
  - id: ASM-004
    assumption: USD is the reporting presentation currency while original asset denominations remain authoritative.
    owner: Accounting and Economic Risk Authority
    evidence: adr/0005-ledger-topology-and-reporting.md
    expiry: 2026-10-24
    downstream_impact: Ledger dimensions and reporting models
    validation: No journal may convert or net original denomination implicitly
  - id: ASM-005
    assumption: Phase 3 settlement assets are reviewed standard ERC-20 tokens without transfer fees rebasing callbacks or nonstandard balance behavior.
    owner: Security Authority
    evidence: adr/0008-phase-3-core-loan-and-accounting-boundary.md
    expiry: 2026-10-24
    downstream_impact: Funding disbursement repayment and accounting evidence
    validation: Registry admission review and exact balance-delta checks on every transfer
  - id: ASM-006
    assumption: Phase 3 chain events reach configured finality before authoritative ledger posting.
    owner: Accounting and Economic Risk Authority
    evidence: services/foundation-ledger/internal/loanaccounting/accounting.go
    expiry: 2026-10-24
    downstream_impact: Loan obligation fee and repayment journals
    validation: Accounting event adapters reject any finality other than FINAL
  - id: ASM-007
    assumption: Phase 4A oracle adapters are governance-reviewed read-only contracts whose source identities and decimals match their configured pair.
    owner: Security Authority
    evidence: adr/0009-phase-4a-deterministic-risk-foundation.md
    expiry: 2026-10-24
    downstream_impact: Collateral valuation servicing and liquidation eligibility
    validation: Adapter allowlist code review bounded source count and quorum-safe failure behavior
  - id: ASM-008
    assumption: Phase 4A interest policies use actual-365 simple accrual with floor division and do not represent compound or negative rates.
    owner: Accounting and Economic Risk Authority
    evidence: docs/architecture/phase-4a-risk-servicing.md
    expiry: 2026-10-24
    downstream_impact: Debt snapshots installments servicing and accounting
    validation: Exact cross-language vectors and policy-version review
  - id: ASM-009
    assumption: Admitted on-chain collateral tokens implement standard ERC20 ERC721 or ERC1155 balance ownership and transfer semantics.
    owner: Security Authority
    evidence: adr/0010-phase-4b1-collateral-custody-boundary.md
    expiry: 2026-10-24
    downstream_impact: Custody existence release and liquidation disposition
    validation: Asset admission review exact ERC20 deltas NFT callback matching and active-registry checks
  - id: ASM-010
    assumption: Phase 4B2 settlement tokens use reviewed exact ERC20 transfer and allowance semantics without fees rebasing callbacks or denylisting of protocol participants.
    owner: Security Authority
    evidence: adr/0011-phase-4b2-reproducible-liquidation.md
    expiry: 2026-10-24
    downstream_impact: Bid escrow lender recovery execution costs refunds and borrower surplus
    validation: Asset admission plus exact balance deltas and atomic settlement rollback tests
  - id: ASM-011
    assumption: Phase 5 commitments and distributions use one reviewed exact-transfer ERC20 settlement asset per syndicated loan.
    owner: Security Authority
    evidence: adr/0012-phase-5-syndication-and-position-boundary.md
    expiry: 2026-10-24
    downstream_impact: Escrow disbursement refund repayment and position distribution conservation
    validation: Active asset admission and exact sender recipient and vault balance-delta checks
  - id: ASM-012
    assumption: A bounded maximum of eight tranches and 64 lifetime position identifiers is acceptable for the first syndication implementation.
    owner: Protocol Architecture Authority
    evidence: docs/architecture/phase-5-syndication.md
    expiry: 2026-10-24
    downstream_impact: Activation distribution gas cost and supported syndicate size
    validation: Contract constants capacity rejections optimized runtime-size gate and full-capacity testing before public testnet
