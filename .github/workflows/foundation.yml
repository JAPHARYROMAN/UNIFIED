name: Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.6"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.15"
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: pnpm
      - uses: bufbuild/buf-setup-action@v1
        with:
          version: "1.69.0"
          github_token: ${{ github.token }}
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.7.1"
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen
      - name: Generate and verify
        shell: pwsh
        run: |
          ./scripts/generate.ps1
          git diff --exit-code
          uv run --frozen python tools/check_phase9_local_prohibitions.py
          ./scripts/check-foundation.ps1

  local-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache: true
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12.6"
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.15"
          enable-cache: true
      - uses: pnpm/action-setup@v6
        with:
          version: "10.28.2"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.13.1"
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: "v1.7.1"
      - name: Prepare pinned Solidity dependencies
        shell: pwsh
        run: |
          pnpm install --frozen-lockfile
          uv sync --frozen
          ./scripts/prepare-foundry.ps1
      - name: Stage pinned Foundry tools for Phase 9 topology
        shell: pwsh
        run: |
          $target = Join-Path $PWD '.cache/foundry-v1.7.1'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          foreach ($name in @('forge', 'cast', 'anvil')) {
            $source = (Get-Command $name -ErrorAction Stop).Source
            New-Item -ItemType SymbolicLink -Path (Join-Path $target $name) `
              -Target $source | Out-Null
          }
      - name: Verify Phase 9 synthetic-local prohibition surface
        shell: pwsh
        run: uv run --frozen python tools/check_phase9_local_prohibitions.py
      - name: Deploy and verify non-activating Phase 9 topology
        timeout-minutes: 10
        shell: pwsh
        run: ./scripts/smoke-phase9-refinance-anvil.ps1
      - name: Start isolated foundation topology
        shell: pwsh
        run: ./scripts/local-up.ps1
      - name: Exercise command event and ledger flow
        shell: pwsh
        run: ./scripts/smoke-local.ps1
      - name: Deploy and verify Phase 8 across both local domains
        shell: bash
        run: bash scripts/smoke-phase8-anvil.sh
      - name: Verify concurrent cancellation replay
        shell: pwsh
        run: ./scripts/test-phase8-cancellation-concurrency.ps1
      - name: Validate Phase 8 release evidence before reset
        shell: pwsh
        run: ./scripts/check-phase8-release-evidence.ps1 -Stage pre-reset
      - name: Reset isolated topology
        if: always()
        shell: pwsh
        run: ./scripts/local-reset.ps1
      - name: Validate Phase 8 cleanup after reset
        if: always()
        shell: pwsh
        run: ./scripts/check-phase8-release-evidence.ps1 -Stage post-reset
