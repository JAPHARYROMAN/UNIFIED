[profile.default]
src = "src"
test = "test"
out = "out"
cache_path = "cache"
libs = ["lib"]
remappings = ["@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/"]
solc_version = "0.8.36"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
deny = "warnings"
# 3860/5574 arise only from test/script harnesses that embed many deployment bytecodes.
# Production deployed-size limits are checked separately in scripts/check-contract-sizes.py.
ignored_error_codes = [3860, 5574, 6335]
# Unopened Phase 9 interface-freeze mutators intentionally remain nonpayable while
# their sole body statement is the canonical fail-closed revert. Keep warning 2018
# scoped to those exact frozen source files; every other warning remains denied.
ignored_error_codes_from = [
    ["src/resolution/Phase9LoanFactory.sol", [2018]],
    ["src/resolution/Phase9LoanAccount.sol", [2018]],
    ["src/resolution/CollateralCustodyV2.sol", [2018]],
    ["src/resolution/LienRegistry.sol", [2018]],
    ["src/resolution/RefinanceCoordinator.sol", [2018]],
    ["src/resolution/PositionManagerV2.sol", [2018]],
    ["src/resolution/RestructuringController.sol", [2018]],
    ["src/protection/InsuranceReserveVault.sol", [2018]],
    ["src/protection/ReservePolicy.sol", [2018]],
    ["src/protection/InsuranceManager.sol", [2018]],
    ["src/recovery/GuaranteeVault.sol", [2018]],
    ["src/recovery/RecoveryManager.sol", [2018]],
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

[invariant]
# Keep stateful coverage substantial while bounding the quadratic message-history
# assertions in the Phase 8 handlers for reproducible local and CI execution.
runs = 128
depth = 64

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
