version: v2
clean: true
plugins:
  - local:
      - go
      - run
      - google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
    out: packages/generated/go
    opt:
      - paths=source_relative
  - local:
      - pnpm
      - exec
      - protoc-gen-es
    out: packages/generated/typescript
    opt:
      - target=ts
      - import_extension=js
inputs:
  - directory: schemas/proto

