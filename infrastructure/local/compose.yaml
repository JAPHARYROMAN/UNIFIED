name: unified-local

x-unified-labels: &unified-labels
  com.unified.environment: local
  com.unified.contains-real-value: "false"

services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:v1.7.1
    command:
      - anvil
      - --host
      - 0.0.0.0
      - --chain-id
      - "31337"
      - --block-time
      - "1"
      - --silent
    ports:
      - "127.0.0.1:8545:8545"
    labels: *unified-labels
    healthcheck:
      test: ["CMD", "cast", "block-number", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: unified_local
      POSTGRES_USER: unified_local
      POSTGRES_PASSWORD: local-only-not-a-secret
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    labels: *unified-labels
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unified_local -d unified_local"]
      interval: 5s
      timeout: 3s
      retries: 20

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v25.2.10
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 512M
      - --reserve-memory
      - 0M
      - --node-id
      - "0"
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:9092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:9092
    ports:
      - "127.0.0.1:19092:9092"
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    labels: *unified-labels
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: unified_local
      MINIO_ROOT_PASSWORD: local-only-not-a-secret
    ports:
      - "127.0.0.1:59000:9000"
      - "127.0.0.1:59001:9001"
    volumes:
      - minio-data:/data
    labels: *unified-labels
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  mock-provider:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating", "--verbose"]
    ports:
      - "127.0.0.1:58080:8080"
    volumes:
      - ./mock-provider:/home/wiremock:ro
    labels: *unified-labels
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8080/__admin/health"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
    labels: *unified-labels
  redpanda-data:
    labels: *unified-labels
  minio-data:
    labels: *unified-labels

