[project]
name = "unified-foundation"
version = "0.1.0"
description = "Unified foundation models and deterministic schema generation"
requires-python = "==3.12.6"
dependencies = [
  "grpcio-tools==1.83.0",
  "pycryptodome==3.23.0",
  "protobuf==7.35.1"
]

[dependency-groups]
dev = [
  "jsonschema==4.25.1",
  "mypy==2.3.0",
  "pip-audit==2.10.1",
  "pytest==9.1.1",
  "ruff==0.16.1",
  "types-jsonschema==4.25.1.20251009"
]

[tool.pytest.ini_options]
testpaths = ["models", "tools/tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "S", "UP"]

[tool.ruff.lint.per-file-ignores]
"**/tests/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
